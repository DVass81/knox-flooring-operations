openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Job operations
  - name: materials
    description: Material operations
  - name: proposals
    description: Proposal operations
  - name: leads
    description: Lead operations
  - name: settings
    description: Settings operations
  - name: photos
    description: Job photo operations
  - name: salespeople
    description: Sales team member operations
  - name: invoices
    description: Invoice operations
  - name: products
    description: Product catalog / inventory operations
  - name: communications
    description: Email and SMS communications
  - name: measurements
    description: Measure Square measurements and two-way sync
  - name: tasks
    description: Internal task calendar operations
  - name: calendar
    description: Google Calendar two-way sync operations
  - name: public
    description: Public customer-facing endpoints (token-based, read-only)
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [ health ]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    get:
      operationId: listJobs
      tags: [ jobs ]
      summary: List all jobs
      responses:
        "200":
          description: A list of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [ jobs ]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [ jobs ]
      summary: Get a job by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: A job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateJob
      tags: [ jobs ]
      summary: Update a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteJob
      tags: [ jobs ]
      summary: Delete a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /materials:
    get:
      operationId: listMaterials
      tags: [ materials ]
      summary: List all materials
      responses:
        "200":
          description: A list of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialRecord"
  /proposals:
    get:
      operationId: listProposals
      tags: [ proposals ]
      summary: List all proposals
      responses:
        "200":
          description: A list of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
    post:
      operationId: createProposal
      tags: [ proposals ]
      summary: Create a proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "201":
          description: Created proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
  /proposals/{id}:
    patch:
      operationId: updateProposal
      tags: [ proposals ]
      summary: Update a proposal
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalUpdate"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proposals/{id}/convert:
    post:
      operationId: convertProposal
      tags: [ proposals ]
      summary: Convert an accepted quote into a job and a draft invoice
      description: |
        Creates a job (with per-job materials and a material-readiness record)
        and a draft invoice from an accepted quote, carrying over line items,
        salesperson, totals, and the deposit. Idempotent — returns the existing
        job and invoice if the quote was already converted.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Existing job and invoice (already converted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertProposalResult"
        "201":
          description: Created job and invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertProposalResult"
        "400":
          description: Quote is not in an acceptable state to convert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /leads:
    get:
      operationId: listLeads
      tags: [ leads ]
      summary: List all leads
      responses:
        "200":
          description: A list of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [ leads ]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [ leads ]
      summary: Get a lead by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: A lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateLead
      tags: [ leads ]
      summary: Update a lead
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLead
      tags: [ leads ]
      summary: Delete a lead
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /communications:
    get:
      operationId: listCommunications
      tags: [ communications ]
      summary: List communications, optionally filtered by lead or customer
      parameters:
        - name: leadId
          in: query
          required: false
          schema:
            type: string
        - name: customerKey
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of communications (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Communication"
  /communications/email:
    post:
      operationId: sendEmail
      tags: [ communications ]
      summary: Send an email and log it as a communication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailRequest"
      responses:
        "201":
          description: Sent and logged communication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Communication"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Email provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Email provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /communications/sms:
    post:
      operationId: sendSms
      tags: [ communications ]
      summary: Send an SMS and log it as a communication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSmsRequest"
      responses:
        "201":
          description: Sent and logged communication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Communication"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: SMS provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: SMS provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /measurements:
    get:
      operationId: listMeasurements
      tags: [ measurements ]
      summary: List measurements, optionally filtered by lead or job
      parameters:
        - name: leadId
          in: query
          required: false
          schema:
            type: string
        - name: jobId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of measurements (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"
    post:
      operationId: createMeasurement
      tags: [ measurements ]
      summary: Create a measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "201":
          description: Created measurement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
  /measurements/{id}:
    patch:
      operationId: updateMeasurement
      tags: [ measurements ]
      summary: Update a measurement
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementUpdate"
      responses:
        "200":
          description: Updated measurement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMeasurement
      tags: [ measurements ]
      summary: Delete a measurement
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /measurements/sync:
    post:
      operationId: syncMeasurements
      tags: [ measurements ]
      summary: Run a two-way sync with Measure Square
      description: |
        Pulls measurements from Measure Square (upserting by external id) and
        pushes app-side changes back out. Returns a summary including the
        Measure Square connection state. When Measure Square is not connected,
        the call succeeds with connected=false and a clear message rather than
        erroring.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncMeasurementsRequest"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncMeasurementsResult"
  /measure-square/status:
    get:
      operationId: getMeasureSquareStatus
      tags: [ measurements ]
      summary: Get the Measure Square connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasureSquareStatus"
  /settings:
    get:
      operationId: getSettings
      tags: [ settings ]
      summary: Get settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [ settings ]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /jobs/{id}/photos:
    get:
      operationId: listJobPhotos
      tags: [ photos ]
      summary: List photos for a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: A list of job photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobPhoto"
    post:
      operationId: createJobPhoto
      tags: [ photos ]
      summary: Attach a photo to a job stage
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPhotoInput"
      responses:
        "201":
          description: Created job photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPhoto"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/photos/{photoId}:
    delete:
      operationId: deleteJobPhoto
      tags: [ photos ]
      summary: Delete a job photo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /salespeople:
    get:
      operationId: listSalespeople
      tags: [ salespeople ]
      summary: List all sales team members
      responses:
        "200":
          description: A list of salespeople
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salesperson"
    post:
      operationId: createSalesperson
      tags: [ salespeople ]
      summary: Create a sales team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalespersonInput"
      responses:
        "201":
          description: Created salesperson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salesperson"
  /salespeople/{id}:
    patch:
      operationId: updateSalesperson
      tags: [ salespeople ]
      summary: Update a sales team member
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalespersonUpdate"
      responses:
        "200":
          description: Updated salesperson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salesperson"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSalesperson
      tags: [ salespeople ]
      summary: Delete a sales team member
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invoices:
    get:
      operationId: listInvoices
      tags: [ invoices ]
      summary: List all invoices
      responses:
        "200":
          description: A list of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [ invoices ]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}:
    patch:
      operationId: updateInvoice
      tags: [ invoices ]
      summary: Update an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteInvoice
      tags: [ invoices ]
      summary: Delete an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products:
    get:
      operationId: listProducts
      tags: [ products ]
      summary: List all catalog products
      responses:
        "200":
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [ products ]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [ products ]
      summary: Update a catalog product
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProduct
      tags: [ products ]
      summary: Delete a catalog product
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/materials:
    get:
      operationId: listJobMaterials
      tags: [ jobs ]
      summary: List materials needed for a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: A list of job materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobMaterial"
    post:
      operationId: createJobMaterial
      tags: [ jobs ]
      summary: Add a material line item to a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobMaterialInput"
      responses:
        "201":
          description: Created job material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMaterial"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/materials/{materialId}:
    patch:
      operationId: updateJobMaterial
      tags: [ jobs ]
      summary: Update a job material line item
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobMaterialUpdate"
      responses:
        "200":
          description: Updated job material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMaterial"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteJobMaterial
      tags: [ jobs ]
      summary: Delete a job material line item
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/labor:
    get:
      operationId: listLaborEntries
      tags: [ jobs ]
      summary: List actual labor-hour entries for a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: A list of labor entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaborEntry"
    post:
      operationId: createLaborEntry
      tags: [ jobs ]
      summary: Log actual labor hours against a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaborEntryInput"
      responses:
        "201":
          description: Created labor entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/labor/{entryId}:
    patch:
      operationId: updateLaborEntry
      tags: [ jobs ]
      summary: Update a labor-hour entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaborEntryUpdate"
      responses:
        "200":
          description: Updated labor entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLaborEntry
      tags: [ jobs ]
      summary: Delete a labor-hour entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/material-usage:
    get:
      operationId: listMaterialUsage
      tags: [ jobs ]
      summary: List actual material-usage entries for a job
